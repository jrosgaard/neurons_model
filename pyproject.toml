[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurons-model"
version = "0.1.0"
license = "MIT"
description = "Neuron Sandbox model development"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "J Rosgaard" }]
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.16.3",
    "pandas>=2.33",
    "matplotlib>=3.10.8",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
ui = [
    "streamlit",
    "psutil",
]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
